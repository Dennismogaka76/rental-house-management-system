{% extends "base.html" %}
{% block anon %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Create tenant account</h3>
        <form method="post" enctype="multipart/form-data">{% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
