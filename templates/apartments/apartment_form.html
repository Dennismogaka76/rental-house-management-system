{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">{% if object %}Edit{% else %}Add{% endif %} Apartment</h3>
<div class="card"><div class="card-body"><form method="post">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
    {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}</div>{% endfor %}
  <button class="btn btn-primary">Save</button>
  <a href="{% url 'apartments:apartment_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form></div></div>
{% endblock %}
